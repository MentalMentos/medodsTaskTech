name: Deploy App

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Имя ветки или тега (напр. main или v1.0)'
        required: true
        default: 'main' # Добавили значение по умолчанию

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOST: root@178.72.138.235
      DEPLOY_DIRECTORY: /root/apps/medods-task

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Убедитесь, что при запуске вы вводите существующий тег/ветку
          ref: ${{ github.event.inputs.tag }}

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy files via Rsync
        run: |
            # Добавляем паузу перед подключением
            sleep 10

            # Пробуем несколько раз
            for i in {1..3}; do
              rsync -avz -e "ssh -o StrictHostKeyChecking=no -o PubkeyAcceptedAlgorithms=+ssh-rsa -o ConnectTimeout=30" \
              --exclude='.git' --exclude='bin' \
              ./ ${{ env.HOST }}:${{ env.DEPLOY_DIRECTORY }}/ && break

              echo "Attempt $i failed, retrying in 10 seconds..."
              sleep 10
            done

      - name: Create .env from Secrets
        run: |
          # Добавляем флаг совместимости и сюда для каждой SSH команды
          ssh -o StrictHostKeyChecking=no -o PubkeyAcceptedAlgorithms=+ssh-rsa ${{ env.HOST }} "
            mkdir -p ${{ env.DEPLOY_DIRECTORY }}
            cd ${{ env.DEPLOY_DIRECTORY }}
            echo 'PG_DATABASE_NAME=${{ secrets.PG_DATABASE_NAME }}' > .env
            echo 'PG_USER=${{ secrets.PG_USER }}' >> .env
            echo 'PG_PASSWORD=${{ secrets.PG_PASSWORD }}' >> .env
            echo 'PG_PORT=5432' >> .env
            echo 'MIGRATION_DIR=${{ secrets.MIGRATION_DIR }}' >> .env
          "

      - name: Start Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o PubkeyAcceptedAlgorithms=+ssh-rsa \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=5 \
              ${{ env.HOST }} "
            cd ${{ env.DEPLOY_DIRECTORY }}
            timeout 600 docker compose up --build -d
          "
